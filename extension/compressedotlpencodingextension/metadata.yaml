type: compressedotlpencoding

status:
  class: extension
  stability:
    alpha: [ extension ]

telemetry:
  metrics:
    compressedotlp_decoding_compressed_size:
      enabled: true
      stability: development
      description: Size of payload before decoding, including magic header
      unit: By
      sum:
        value_type: int
        monotonic: true
      attributes: [signal]
    compressedotlp_decoding_count:
      enabled: true
      stability: development
      description: Count of decoding operation
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [magic_parsing_outcome, outcome, signal]
    compressedotlp_decoding_uncompressed_size:
      enabled: true
      stability: development
      description: Size of payload after decoding
      unit: By
      sum:
        value_type: int
        monotonic: true
      attributes: [signal]
    compressedotlp_encoding_compressed_size:
      enabled: true
      stability: development
      description: Size of payload after encoding, including magic header
      unit: By
      sum:
        value_type: int
        monotonic: true
      attributes: [signal]
    compressedotlp_encoding_count:
      enabled: true
      stability: development
      description: Count of encoding operation
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [encoding_enabled, outcome, signal]
    compressedotlp_encoding_uncompressed_size:
      enabled: true
      stability: development
      description: Size of payload before encoding
      unit: By
      sum:
        value_type: int
        monotonic: true
      attributes: [signal]

attributes:
  encoding_enabled:
    description: Whether encoding is enabled
    type: bool
  magic_parsing_outcome:
    description: Outcome of magic header parsing
    type: string
    enum: [success, failure]
  outcome:
    description: The operation outcome.
    type: string
    enum: [success, failure]
  signal:
    description: Type of telemetry
    type: string
    enum: [traces, metrics, logs, profiles]

tests:
  config:
