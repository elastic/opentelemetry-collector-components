dist:
  module: github.com/elastic/opentelemetry-collector-components
  name: otelsoak
  description: Minimal OpenTelemetry Collector distribution for OTLP soak testing
  version: 0.1.0
  output_path: ./_build

receivers:
  - gomod: github.com/elastic/opentelemetry-collector-components/receiver/loadgenreceiver v0.68.0

processors:
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/ratelimitprocessor v0.68.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.165.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.165.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.71.0

replaces:
  - github.com/elastic/opentelemetry-collector-components/receiver/loadgenreceiver => ../receiver/loadgenreceiver
  - github.com/elastic/opentelemetry-collector-components/processor/ratelimitprocessor => ../processor/ratelimitprocessor
