resourceMetrics:
  - resource:
      attributes:
        - key: asdf
          value:
            stringValue: foo
    schemaUrl: https://test-res-schema.com/schema
    scopeMetrics:
      - metrics:
          - name: delta.monotonic.sum.1
            sum:
              aggregationTemporality: 1
              dataPoints:
                - asDouble: 555
                  attributes:
                    - key: aaa
                      value:
                        stringValue: bbb
                  timeUnixNano: "1000000"
              isMonotonic: true
          - description: Overflow metric count due to metric limit
            name: _overflow_metric
            sum:
              aggregationTemporality: 1
              dataPoints:
                - asInt: "1"
                  attributes:
                    - key: metric_overflow
                      value:
                        boolValue: true
          - description: Overflow datapoint count due to datapoint limit
            name: _overflow_datapoints
            sum:
              aggregationTemporality: 1
              dataPoints:
                - asInt: "1"
                  attributes:
                    - key: dp_overflow
                      value:
                        boolValue: true
        schemaUrl: https://test-scope-schema.com/schema
        scope:
          attributes:
            - key: foo
              value:
                stringValue: bar
          name: MyTestInstrument
          version: 1.2.3
