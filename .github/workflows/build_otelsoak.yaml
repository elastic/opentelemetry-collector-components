name: build-otelsoak-image
run-name: Build otelsoak Docker image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_otelsoak.yaml
      - .go-version
      - Makefile
      - distributions/otelsoak/**
      - internal/tools/**
      - processor/ratelimitprocessor/**
      - receiver/loadgenreceiver/**
  pull_request:
    paths:
      - .github/workflows/build_otelsoak.yaml
      - .go-version
      - Makefile
      - distributions/otelsoak/**
      - internal/tools/**
      - processor/ratelimitprocessor/**
      - receiver/loadgenreceiver/**

permissions:
  contents: read

jobs:
  build-otelsoak-image:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Install tools
        run: make install-tools
      - name: Build Docker image
        run: make buildotelsoakdocker TAG=ci
      - name: Validate image configuration
        run: |
          docker run --rm \
            -e ELASTIC_APM_SERVER_URL=http://localhost:8200 \
            -e ELASTIC_APM_API_KEY=foobar \
            otelsoak:ci validate --config /etc/otelsoak/config.yaml
