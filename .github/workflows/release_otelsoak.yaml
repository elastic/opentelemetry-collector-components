name: otelsoak-image
run-name: Build or release otelsoak Docker image

on:
  pull_request:
    paths:
      - .github/workflows/release_otelsoak.yaml
      - .go-version
      - Makefile
      - distributions/otelsoak/**
      - internal/tools/**
      - processor/ratelimitprocessor/**
      - receiver/loadgenreceiver/**
  push:
    branches:
      - main
    paths:
      - distributions/otelsoak/Makefile

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - name: Install tools
        run: make install-tools

      - name: Build Docker image
        run: make buildotelsoakdocker TAG=ci

      - name: Validate image configuration
        run: |
          docker run --rm \
            -e ELASTIC_APM_SERVER_URL=http://localhost:8200 \
            -e ELASTIC_APM_API_KEY=foobar \
            otelsoak:ci validate --config /etc/otelsoak/config.yaml

  build-and-push:
    if: github.event_name == 'push'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      ELASTIC_REGISTRY: "docker.elastic.co/observability-ci/otelsoak"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - name: Install tools
        run: make install-tools

      - name: Get otelsoak version
        working-directory: ./distributions/otelsoak
        run: echo "OTELOSOAK_VERSION=$(make get-version)" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Elastic container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.ELASTIC_REGISTRY }}
          username: ${{ secrets.ELASTIC_DOCKER_USERNAME }}
          password: ${{ secrets.ELASTIC_DOCKER_PASSWORD }}

      - name: Build Linux binary
        run: TARGET_GOOS=linux TARGET_GOARCH=${{ matrix.arch }} CGO_ENABLED=0 make genotelsoak

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distributions/otelsoak/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.ELASTIC_REGISTRY }}:${{ env.OTELOSOAK_VERSION }}-${{ matrix.arch }}

  create-multiarch-tag:
    if: github.event_name == 'push'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [build-and-push]
    env:
      ELASTIC_REGISTRY: "docker.elastic.co/observability-ci/otelsoak"
    steps:
      - uses: actions/checkout@v7

      - name: Get otelsoak version
        working-directory: ./distributions/otelsoak
        run: echo "OTELOSOAK_VERSION=$(make get-version)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Login to Elastic container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.ELASTIC_REGISTRY }}
          username: ${{ secrets.ELASTIC_DOCKER_USERNAME }}
          password: ${{ secrets.ELASTIC_DOCKER_PASSWORD }}

      - name: Create multi-platform image tag
        run: |
          docker buildx imagetools create \
            --tag "${ELASTIC_REGISTRY}:${OTELOSOAK_VERSION}" \
            "${ELASTIC_REGISTRY}:${OTELOSOAK_VERSION}-amd64" \
            "${ELASTIC_REGISTRY}:${OTELOSOAK_VERSION}-arm64"
